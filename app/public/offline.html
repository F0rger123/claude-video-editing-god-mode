<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline — God Mode Cut</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #f4f4f2; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-content: center; padding: 24px; gap: 14px; max-width: 26rem; margin: 0 auto; }
      h1 { font-size: 2rem; letter-spacing: -0.04em; margin: 0; }
      p { color: #b3b3b3; line-height: 1.6; margin: 0; }
      button { justify-self: start; margin-top: 8px; height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: #f4f4f2; color: #000; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection.</h1>
      <p>Client content is never stored on this phone, so it needs the internet to load. Uploads you started will need to be restarted once you are back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
