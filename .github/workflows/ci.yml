name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/check-kit.mjs
      - run: node scripts/sync-codex-skills.mjs --check
