<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Claude Video Editing God Mode</title>
  <desc id="d">Raw footage in, finished reels out. AI editing skills for Claude plus a phone app for uploads, approvals and scheduling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060f"/>
      <stop offset="0.6" stop-color="#120a24"/>
      <stop offset="1" stop-color="#1c0d14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.6" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f1e7ff"/>
      <stop offset="1" stop-color="#ffd7b8"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.1" cy="0" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.95" cy="1" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glowL)"/>
  <rect width="1280" height="420" fill="url(#glowR)"/>

  <!-- app mark -->
  <g transform="translate(72 70) scale(0.19)">
    <rect width="512" height="512" rx="112" fill="url(#brand)"/>
    <path d="M190 140 L380 256 L190 372 Z" fill="#fff" stroke="#fff" stroke-width="28" stroke-linejoin="round"/>
    <path d="M380 88 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z" fill="#fff" opacity="0.9"/>
  </g>
  <text x="182" y="104" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#c4b5fd">CLAUDE  ·  CODEX  ·  HYPERFRAMES</text>
  <text x="182" y="132" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="1" fill="#a3a3b8">part of Claude Business God Mode</text>

  <text x="72" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#title)">CLAUDE VIDEO EDITING</text>
  <text x="72" y="284" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#brand)">GOD MODE</text>
  <text x="72" y="338" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#d4d4e0">Raw footage in. Finished reels out. From your phone.</text>

  <!-- phone with timeline -->
  <g transform="translate(1040 48)">
    <rect width="190" height="330" rx="30" fill="#0c0b14" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="70" y="12" width="50" height="10" rx="5" fill="#000"/>
    <rect x="14" y="34" width="162" height="190" rx="14" fill="url(#brand)" opacity="0.9"/>
    <path d="M80 92 L124 129 L80 166 Z" fill="#fff"/>
    <rect x="34" y="196" width="122" height="14" rx="4" fill="#000" fill-opacity="0.45"/>
    <text x="95" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">every point <tspan fill="#ffd7b8" font-style="italic">shown</tspan></text>
    <g transform="translate(14 238)">
      <rect width="162" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <rect width="104" height="8" rx="4" fill="url(#brand)"/>
      <rect y="18" width="38" height="22" rx="5" fill="#7c3aed"/>
      <rect x="42" y="18" width="56" height="22" rx="5" fill="#a21caf"/>
      <rect x="102" y="18" width="24" height="22" rx="5" fill="#db2777"/>
      <rect x="130" y="18" width="32" height="22" rx="5" fill="#f97316"/>
      <rect y="46" width="162" height="12" rx="4" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="0" y="64" width="78" height="20" rx="10" fill="#ffffff"/>
      <text x="39" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#111">Approve</text>
      <rect x="84" y="64" width="78" height="20" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="123" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e5e5ee">Changes</text>
    </g>
  </g>
  <!-- floating chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="870" y="92" width="136" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.5"/>
    <text x="938" y="113" text-anchor="middle" fill="#ede9fe">cut silences</text>
    <rect x="840" y="166" width="166" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f0abfc" stroke-opacity="0.5"/>
    <text x="923" y="187" text-anchor="middle" fill="#fae8ff">motion-graphics B-roll</text>
    <rect x="880" y="240" width="126" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#fdba74" stroke-opacity="0.5"/>
    <text x="943" y="261" text-anchor="middle" fill="#ffedd5">karaoke captions</text>
    <rect x="866" y="314" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#86efac" stroke-opacity="0.5"/>
    <text x="936" y="335" text-anchor="middle" fill="#dcfce7">client approval</text>
  </g>
</svg>
